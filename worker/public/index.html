<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3b4240">
  <title>写作间 · sulik0</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/admin.css">
  <script src="/admin.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">跳到内容</a>
  <div class="shell">
    <header class="site-header">
      <a class="logo" href="/" aria-label="sulik0 写作间"><svg viewBox="0 0 26 16" aria-hidden="true"><path d="M2 14a11 11 0 0 1 22 0"/><path d="M7 14a6 6 0 0 1 12 0"/></svg><span>sulik0</span><span class="logo-note">写作间</span></a>
      <nav aria-label="主导航"><a href="https://sulik0.github.io/sulik0-blog/" target="_blank" rel="noopener">查看博客</a><a id="login" href="/login">GitHub 登录</a><a id="logout" href="/logout" hidden>退出</a></nav>
    </header>
    <main id="main">
      <section class="hero" aria-labelledby="welcome">
        <div><p class="intro">生活感悟 / 技术学习</p><h1 id="welcome">把想法，写下来。</h1><p class="subtitle">还没写完的，留在草稿里。<br>准备好了，再分享给世界。</p><button id="new" class="primary">写一篇新文章 <span aria-hidden="true">＋</span></button></div>
        <div class="rainbow" aria-hidden="true"><svg id="bridge" viewBox="0 0 360 250"></svg></div>
      </section>
      <div id="status" class="status" role="status" aria-live="polite">正在检查登录状态…</div>
      <p id="error" class="error" role="alert" hidden></p>
      <section id="library" aria-labelledby="library-title">
        <div class="section-heading"><h2 id="library-title">我的文章</h2><button id="refresh" class="text-button">刷新列表</button></div>
        <div class="filters" role="group" aria-label="文章状态"><button id="filter-posts" aria-pressed="true">已发布 <span id="posts-count">0</span></button><button id="filter-drafts" aria-pressed="false">草稿 <span id="drafts-count">0</span></button></div>
        <p id="draft-note" class="hint" hidden>草稿只保存在当前浏览器，尚未发布。清除网站数据会移除草稿；换设备前可下载备份。</p>
        <div id="entries" class="entries"></div>
      </section>
      <section id="editor" hidden aria-labelledby="editor-title">
        <div class="section-heading"><button id="back" class="text-button">〈 返回文章</button><span id="save-state" class="hint" role="status">尚未保存</span></div>
        <div class="editor-heading"><h2 id="editor-title">新建文章</h2><span id="word-count" class="hint">0 字</span></div>
        <form id="post-form">
          <label class="title-label" for="title">标题</label><input id="title" class="title-input" placeholder="给这篇文章起个名字" autocomplete="off">
          <div class="metadata"><label>文章地址<input id="slug" placeholder="例如 autumn-rain" pattern="[a-z0-9]+(?:-[a-z0-9]+)*" autocomplete="off"><span class="hint">小写英文、数字、连字符</span></label><label>分类<select id="category"><option value="life">生活</option><option value="tech">技术</option></select></label><label>日期<input id="date" type="date"></label></div>
          <label>摘要 <span class="optional">可选</span><input id="excerpt" placeholder="一句话，记下文章的开头"></label>
          <div class="body-heading"><label for="body">正文 <span class="optional">支持 Markdown</span></label><label class="upload" for="image">＋ 插入图片<input id="image" type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/svg+xml"></label></div>
          <textarea id="body" placeholder="从这里开始写…"></textarea>
          <div class="editor-footer"><p class="hint">输入时自动保存本机草稿。只有点击“发布文章”才会公开。</p><div class="actions"><button type="button" id="save-draft" class="secondary">保存草稿</button><button type="submit" id="publish" class="primary">发布文章</button><button type="button" id="download" class="text-button">下载备份</button></div></div>
          <div class="delete-row"><button type="button" id="delete" class="text-button danger" hidden>删除文章</button><button type="button" id="discard" class="text-button danger" hidden>删除这份草稿</button></div>
        </form>
      </section>
    </main>
    <footer><span>© <span id="year"></span> sulik0</span><span>慢慢写，慢慢走。</span></footer>
  </div>
  <noscript>写作间需要启用 JavaScript 才能保存草稿和发布文章。</noscript>
</body>
</html>
